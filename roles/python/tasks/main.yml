---
- name: Install Python development packages
  ansible.builtin.apt:
    name: [python3-dev, python3-pip, python3-venv]
    state: present

- name: Install Python command line tools in a private environment
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.pip:
    name: [pre-commit, ruff]
    virtualenv: "~{{ workstation_user }}/.venvs/tools"
    virtualenv_command: python3 -m venv

- name: Create the user's command folder
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.file:
    path: "~{{ workstation_user }}/.local/bin"
    state: directory
    mode: "0755"

- name: Add the tools to the user's path
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.file:
    src: "~{{ workstation_user }}/.venvs/tools/bin/{{ item }}"
    dest: "~{{ workstation_user }}/.local/bin/{{ item }}"
    state: link
  loop: [pre-commit, ruff]
