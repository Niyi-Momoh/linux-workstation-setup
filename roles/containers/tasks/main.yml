---
- name: Install Docker from Ubuntu's repositories
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present

- name: Add the user to the docker group
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    groups: docker
    append: true
  when: workstation_user_exists | bool

- name: Check whether systemd is running
  ansible.builtin.stat:
    path: /run/systemd/system
  register: containers_systemd

- name: Enable the Docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: containers_systemd.stat.exists
