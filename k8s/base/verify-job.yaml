apiVersion: batch/v1
kind: Job
metadata:
  name: verify-workstation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verify-workstation
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: linux-workstation:local
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/workstation-verify]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: tmp, mountPath: /home/dev/.cache, subPath: cache }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
