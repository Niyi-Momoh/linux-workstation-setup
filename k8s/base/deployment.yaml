apiVersion: apps/v1
kind: Deployment
metadata:
  name: workstation
  labels: &labels
    app.kubernetes.io/name: workstation
spec:
  replicas: 1
  strategy:
    type: Recreate # The workspace volume can attach to only one pod.
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jupyter
          image: linux-workstation:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workstation-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet: { path: /api, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /api, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api, port: http }
            periodSeconds: 15
          volumeMounts:
            - { name: workspace, mountPath: /home/dev/workspace }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
